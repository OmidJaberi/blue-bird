<svg width="1000" height="720" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg">
<defs>
    <style>
        .title { font-family: Arial, sans-serif; font-size: 32px; font-weight: bold; fill: #faf6fc; }
        .moduleTitle { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: white; }
        .moduleText { font-family: Arial, sans-serif; font-size: 14px; fill: white; }
        .arrow { stroke:#64748b; stroke-width:3; fill:none; stroke-linecap:round; marker-end:url(#arrow); }
        .loop { stroke:#10b981; stroke-width:5; fill:none; stroke-linecap:round; stroke-dasharray:10 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
</defs>
<!-- Background -->
<rect width="1000" height="720" fill="#0d1117"/>
<!-- Title -->
<text x="500" y="45" text-anchor="middle" class="title">
    Runtime Event Loop
</text>
<!-- ================================================= -->
<!-- Application -->
<!-- ================================================= -->
<g transform="translate(300,80)">
    <rect width="400" height="80" rx="18" fill="#2563eb"/>
    <text x="200" y="32" text-anchor="middle" class="moduleTitle">
        Application
    </text>
    <text x="200" y="58" text-anchor="middle" class="moduleText">
        Tasks • Timers • Event Handlers
    </text>
</g>
<line x1="500" y1="160" x2="500" y2="210" class="arrow"/>
<!-- ================================================= -->
<!-- Runtime Core -->
<!-- ================================================= -->
<circle cx="500" cy="360" r="150" class="loop"/>
<circle cx="500" cy="360" r="95" fill="#10b981"/>
<text x="500" y="345" text-anchor="middle" class="moduleTitle">
    Runtime Loop
</text>
<text x="500" y="375" text-anchor="middle" class="moduleText">
    Poll
</text>
<text x="500" y="395" text-anchor="middle" class="moduleText">
    Dispatch
</text>
<text x="500" y="415" text-anchor="middle" class="moduleText">
    Execute
</text>
<!-- ================================================= -->
<!-- Circular Flow -->
<!-- ================================================= -->
<path d="M500 210 A150 150 0 0 1 650 360" class="arrow"/>
<path d="M650 360 A150 150 0 0 1 500 510" class="arrow"/>
<path d="M500 510 A150 150 0 0 1 350 360" class="arrow"/>
<path d="M350 360 A150 150 0 0 1 500 210" class="arrow"/>
<!-- ================================================= -->
<!-- Event Sources -->
<!-- ================================================= -->
<g transform="translate(90,290)">
    <rect width="210" height="120" rx="18" fill="#8b5cf6"/>
    <text x="105" y="38" text-anchor="middle" class="moduleTitle">
        Event Sources
    </text>
    <text x="105" y="68" text-anchor="middle" class="moduleText">
        I/O Pollers
    </text>
    <text x="105" y="90" text-anchor="middle" class="moduleText">
        Network • Files
    </text>
</g>
<!-- event arrow -->
<path d="M300 350 L350 350" class="arrow"/>
<!-- ================================================= -->
<!-- Scheduler -->
<!-- ================================================= -->
<g transform="translate(700,290)">
    <rect width="210" height="120" rx="18" fill="#f97316"/>
    <text x="105" y="38" text-anchor="middle" class="moduleTitle">
        Scheduler
    </text>
    <text x="105" y="68" text-anchor="middle" class="moduleText">
        Timers
    </text>
    <text x="105" y="90" text-anchor="middle" class="moduleText">
        Delayed Tasks
    </text>
</g>
<path d="M700 350 L650 350" class="arrow"/>
<!-- ================================================= -->
<!-- Task Queue -->
<!-- ================================================= -->
<g transform="translate(320,570)">
    <rect width="360" height="85" rx="18" fill="#64748b"/>
    <text x="180" y="35" text-anchor="middle" class="moduleTitle">
        Task Execution
    </text>
    <text x="180" y="62" text-anchor="middle" class="moduleText">
        User-Defined Callbacks
    </text>
</g>
<path d="M500 510 L500 570" class="arrow"/>
<!-- Caption -->
<text x="500" y="690" text-anchor="middle" class="moduleText">
    A cooperative runtime that waits for events and executes scheduled work.
</text>
</svg>