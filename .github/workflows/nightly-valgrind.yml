name: Nightly Valgrind

# The wrk load test (tests/load/run_wrk.sh) with bb-loadtest-server running under
# Valgrind memcheck. Valgrind can't be combined with ASan, so this uses a plain
# Debug build; it is 10-50x slower than native, hence nightly / manual only.
# The per-PR sanitizer coverage lives in cmake-multi-platform.yml.
#
# Fails on any Valgrind error or definite/indirect leak, plus everything the
# regular wrk job checks (socket errors, non-2xx, leaked connections or fds,
# metrics that disagree with wrk).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "wrk duration"
        default: "30s"
      connections:
        description: "wrk connections (keep small: Valgrind is slow)"
        default: "16"

jobs:
  valgrind-load-test:
    name: Load test / wrk / Valgrind
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev curl ccache valgrind
          sudo apt-get install -y wrk || echo "wrk is not available from apt; it will be built from source"

      # Fallback in case the distro has no wrk package.
      - name: Build wrk from source if needed
        run: |
          if command -v wrk >/dev/null 2>&1; then
            wrk --version | head -n 1
            exit 0
          fi
          sudo apt-get install -y build-essential libssl-dev
          git clone --depth 1 --branch 4.2.0 https://github.com/wg/wrk.git "$RUNNER_TEMP/wrk"
          make -C "$RUNNER_TEMP/wrk" -j"$(nproc)" WITH_OPENSSL=/usr
          sudo install "$RUNNER_TEMP/wrk/wrk" /usr/local/bin/wrk
          wrk --version | head -n 1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-valgrind-${{ github.sha }}
          restore-keys: |
            ccache-valgrind-

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DBB_ENABLE_SANITIZERS=OFF
        env:
          CCACHE_DIR: ~/.ccache

      - name: Build load-test server
        run: cmake --build build --target bb-loadtest-server --parallel
        env:
          CCACHE_DIR: ~/.ccache

      - name: Run wrk load test under Valgrind
        run: bash tests/load/run_wrk.sh
        env:
          BB_WRK_DURATION: ${{ inputs.duration || '30s' }}
          BB_WRK_CONNECTIONS: ${{ inputs.connections || '16' }}
          BB_WRK_THREADS: 2
          BB_WRK_TIMEOUT: 30s
          BB_START_TIMEOUT_S: 60
          BB_STOP_TIMEOUT_S: 180
          BB_SERVER_WRAPPER: >-
            valgrind --leak-check=full
            --show-leak-kinds=definite,indirect
            --errors-for-leak-kinds=definite,indirect
            --error-exitcode=99 --num-callers=30
            --log-file=build/load-results/valgrind.log

      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-load-test-results
          path: build/load-results/
          if-no-files-found: ignore
          retention-days: 14
