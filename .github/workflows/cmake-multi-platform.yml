name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / GCC / Debug
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitizers: OFF

          - name: Ubuntu / GCC / Release
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizers: OFF

          - name: Ubuntu / Clang / Debug
            os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: OFF

          - name: Ubuntu / Clang / Sanitizers
            os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON

          - name: macOS / Clang / Debug
            os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: OFF

          - name: Windows / MSVC / Release
            os: windows-latest
            compiler: msvc
            cc: cl
            build_type: Release
            sanitizers: OFF

    steps:
      - uses: actions/checkout@v4

      # ---------- Linux ----------
      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-sqlite3

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ccache

      - name: Cache ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitizers }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitizers }}-

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DBB_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
        env:
          CCACHE_DIR: ~/.ccache

      # ---------- macOS ----------
      # sqlite3 ships with the macOS SDK, so no extra dependencies.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DBB_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      # ---------- Windows ----------
      - name: Get vcpkg commit
        if: runner.os == 'Windows'
        id: vcpkg-commit
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          echo "sha=$commit" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/packages
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg-commit.outputs.sha }}-sqlite3-pthreads

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows pthreads:x64-windows

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBB_ENABLE_SANITIZERS=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # ---------- Shared ----------
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  # Load test: hammer bb-loadtest-server with wrk and cross-check the result
  # against the server's own /metrics (see tests/load/README.md). Fails on
  # errors, crashes, leaked connections or file descriptors, and (in the
  # sanitizer run) any ASan/UBSan/LeakSanitizer report; not on a requests/sec
  # threshold.
  load-test:
    name: Load test / wrk / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            slug: release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizers: OFF
            duration: 15s

          - name: ASan + UBSan
            slug: asan
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON
            duration: 10s

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev curl ccache
          sudo apt-get install -y wrk || echo "wrk is not available from apt; it will be built from source"

      # Fallback in case the distro has no wrk package.
      - name: Build wrk from source if needed
        run: |
          if command -v wrk >/dev/null 2>&1; then
            wrk --version | head -n 1
            exit 0
          fi
          sudo apt-get install -y build-essential libssl-dev
          git clone --depth 1 --branch 4.2.0 https://github.com/wg/wrk.git "$RUNNER_TEMP/wrk"
          make -C "$RUNNER_TEMP/wrk" -j"$(nproc)" WITH_OPENSSL=/usr
          sudo install "$RUNNER_TEMP/wrk/wrk" /usr/local/bin/wrk
          wrk --version | head -n 1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-load-test-${{ matrix.slug }}-${{ github.sha }}
          restore-keys: |
            ccache-load-test-${{ matrix.slug }}-

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DBB_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
        env:
          CCACHE_DIR: ~/.ccache

      - name: Build load-test server
        run: cmake --build build --target bb-loadtest-server --parallel
        env:
          CCACHE_DIR: ~/.ccache

      # The sanitizer options are ignored by the non-sanitizer build. A leak
      # makes LeakSanitizer exit non-zero at shutdown, which the script reports.
      - name: Run wrk load test
        run: bash tests/load/run_wrk.sh
        env:
          BB_WRK_DURATION: ${{ matrix.duration }}
          BB_WRK_THREADS: 2
          BB_WRK_CONNECTIONS: 64
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ matrix.slug }}
          path: build/load-results/
          if-no-files-found: ignore
          retention-days: 14
